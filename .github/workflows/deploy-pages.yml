# GitHub Pages hanya menyajikan berkas aplikasi (HTML/CSS/JS/ikon).
# Tidak ada data pengguna yang pernah dikirim ke sini: seluruh data tinggal di
# IndexedDB perangkat (PRD bagian 1 dan 9).
name: Sebar ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Uji
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build untuk sub-folder Pages
        run: npm run build
        env:
          BASE_PATH: /app-kesehatan/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  sebar:
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.sebar.outputs.page_url }}
    steps:
      - id: sebar
        uses: actions/deploy-pages@v4
